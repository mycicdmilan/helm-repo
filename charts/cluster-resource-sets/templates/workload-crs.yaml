{{/*
  ClusterResourceSet for Workload Cluster Bootstrap.
  When CAPG creates a new cluster with label "cluster-type: workload",
  CRS automatically applies the bootstrap ConfigMap.
  Future use — disabled by default.
*/}}
{{- if .Values.workloadCluster.enabled }}
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: workload-cluster-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm-repo
    app.kubernetes.io/component: crs
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      {{- toYaml .Values.workloadCluster.matchLabels | nindent 6 }}
  resources:
    - kind: ConfigMap
      name: workload-bootstrap
{{- end }}
