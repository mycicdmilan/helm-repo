{{/*
  ClusterResourceSet for Management Cluster Bootstrap.
  When CAPG creates a new cluster with label "cluster-type: management",
  CRS automatically applies the bootstrap ConfigMap containing a Job
  that installs ArgoCD + App-of-Apps.
*/}}
{{- if .Values.managementCluster.enabled }}
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: mgmt-cluster-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm-repo
    app.kubernetes.io/component: crs
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      {{- toYaml .Values.managementCluster.matchLabels | nindent 6 }}
  resources:
    - kind: ConfigMap
      name: mgmt-bootstrap
{{- end }}
