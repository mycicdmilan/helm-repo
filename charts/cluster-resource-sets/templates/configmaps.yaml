apiVersion: v1
kind: ConfigMap
metadata:
  name: mgmt-bootstrap-cert-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm-repo
data:
  # TODO: Populate with rendered cert-manager manifests
  # helm template cert-manager charts/cert-manager -n cert-manager > cert-manager.yaml
  cert-manager.yaml: |
    # Rendered cert-manager manifests go here
    # Or use the App-of-Apps approach (see below)
---
# Placeholder: ArgoCD manifests for management cluster
