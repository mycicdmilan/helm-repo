{{/*
  Bootstrap ConfigMaps for CRS.

  Each ConfigMap wraps a YAML manifest that CRS will apply to the target cluster.
  
  HOW TO POPULATE THESE:
  The ConfigMaps below are PLACEHOLDERS. You need to populate them with the
  actual Kubernetes manifests for each component. There are two approaches:

  APPROACH 1 (Recommended): Generate from Helm charts
    Export each chart to YAML and embed in the ConfigMap:
      helm template argocd charts/argocd -f charts/argocd/values-mgmt.yaml > /tmp/argocd.yaml
      kubectl create configmap mgmt-bootstrap-argocd --from-file=argocd.yaml=/tmp/argocd.yaml --dry-run=client -o yaml

  APPROACH 2: Use ArgoCD App-of-Apps pattern instead of CRS
    Instead of embedding manifests in ConfigMaps, use CRS to bootstrap ONLY
    ArgoCD on the new cluster, then let ArgoCD pull the rest from helm-repo.
    This is cleaner for large bootstrap payloads.

  For the POC, Approach 2 is recommended because:
    - CRS ConfigMaps have size limits (~1MB)
    - ArgoCD chart alone is ~500KB+ when rendered
    - App-of-Apps gives you drift detection and self-healing
*/}}

