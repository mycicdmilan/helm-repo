{{/*
  GCP Credentials Secret for CAPG.

  When using Workload Identity Federation (WIF), this secret is a PLACEHOLDER.
  The actual GCP authentication happens via the K8s ServiceAccount annotation
  (iam.gke.io/gcp-service-account) in service-account.yaml.

  The CAPI Operator requires a configSecret reference in the InfrastructureProvider
  CR, so we create an empty secret to satisfy that requirement.

  If NOT using WIF (e.g., in a non-GKE environment), you would populate this
  secret with the base64-encoded GCP service account JSON key:
    GCP_B64ENCODED_CREDENTIALS: <base64 of service-account.json>
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm-repo
    app.kubernetes.io/component: capg
type: Opaque
{{- if .Values.credentials.useWorkloadIdentity }}
# Empty data — WIF provides credentials via the K8s SA annotation
data: {}
{{- else }}
# Populate with GCP credentials JSON (base64-encoded)
# Create manually:
#   export GCP_B64ENCODED_CREDENTIALS=$(cat sa-key.json | base64 | tr -d '\n')
#   kubectl create secret generic gcp-credentials \
#     --from-literal=GCP_B64ENCODED_CREDENTIALS=$GCP_B64ENCODED_CREDENTIALS \
#     -n capg-system
data:
  GCP_B64ENCODED_CREDENTIALS: ""
{{- end }}
