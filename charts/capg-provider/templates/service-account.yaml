{{/*
  K8s ServiceAccount for the CAPG controller.
  When Workload Identity is enabled, this SA is annotated with the GCP SA email.
  The CAPI Operator's CAPG deployment uses this SA, and GKE automatically
  provides GCP credentials via the Workload Identity metadata server.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm-repo
    app.kubernetes.io/component: capg
  {{- if .Values.credentials.useWorkloadIdentity }}
  annotations:
    # This annotation tells GKE to provide the GCP SA's credentials
    # to pods running with this K8s ServiceAccount
    iam.gke.io/gcp-service-account: {{ .Values.workloadIdentity.gcpServiceAccount }}
  {{- end }}
